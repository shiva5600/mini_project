<!DOCTYPE html>
<html>
<head>
<title>Settings - LogSense AI</title>
<style>
body {margin:0;background:#020617;color:white;font-family:Segoe UI;}
.sidebar {width:220px;height:100vh;background:#020617;position:fixed;padding:20px;}
.main {margin-left:240px;padding:20px;}
a {display:block;color:#94a3b8;padding:10px;text-decoration:none;}
a:hover {color:#22c55e;}
button {padding:10px;background:#22c55e;border:none;}
</style>
</head>

<body>

<div class="sidebar">
<h2 style="color:#22c55e;">⚡ LogSense</h2>
<a href="dashboard.html">Dashboard</a>
<a href="logs.html">Logs</a>
<a href="alerts.html">Alerts</a>
<a href="setting.html">Settings</a>
</div>

<div class="main">
<h2>⚙️ Settings</h2>

<p>Logged in as: <b id="user"></b></p>

<button onclick="logout()">Logout</button>

</div>

<script>
let user = localStorage.getItem("loggedInUser");
if(!user){
    window.location.href="index.html";
}
document.getElementById("user").innerText = user;

function logout(){
    localStorage.removeItem("loggedInUser");
    window.location.href="index.html";
}
</script>

</body>
</html>
