<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>LogSense AI Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', sans-serif;
}

body {
    display: flex;
    background: #020617;
    color: white;
}

/* ===== SIDEBAR ===== */
.sidebar {
    width: 230px;
    height: 100vh;
    background: #020617;
    border-right: 1px solid #1e293b;
    padding: 20px;
}

.logo {
    color: #22c55e;
    font-size: 20px;
    margin-bottom: 30px;
}

.menu a {
    display: block;
    padding: 12px;
    margin: 5px 0;
    color: #cbd5f5;
    text-decoration: none;
    border-radius: 8px;
    transition: 0.3s;
}

.menu a:hover {
    background: #1e293b;
    color: #22c55e;
}

/* ===== MAIN ===== */
.main {
    flex: 1;
}

/* Navbar */
.navbar {
    padding: 15px 30px;
    display: flex;
    justify-content: space-between;
    background: rgba(2,6,23,0.9);
    border-bottom: 1px solid #1e293b;
}

.user {
    color: #22c55e;
}

/* Content */
.content {
    padding: 25px;
}

/* Cards */
.cards {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
}

.card {
    padding: 20px;
    border-radius: 12px;
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(10px);
    transition: 0.3s;
}

.card:hover {
    transform: translateY(-5px);
}

.card h3 {
    font-size: 14px;
    color: #94a3b8;
}

.card p {
    font-size: 24px;
    color: #22c55e;
}

/* Grid layout */
.grid {
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: 20px;
    margin-top: 20px;
}

/* Chart */
.chart-box, .alerts {
    padding: 20px;
    border-radius: 12px;
    background: rgba(255,255,255,0.05);
}

/* Table */
.table-box {
    margin-top: 20px;
    padding: 20px;
    border-radius: 12px;
    background: rgba(255,255,255,0.05);
}

table {
    width: 100%;
    border-collapse: collapse;
}

th, td {
    padding: 10px;
    border-bottom: 1px solid #334155;
}

.error { color: #ef4444; }
.warning { color: #facc15; }

/* Alerts */
.alert {
    padding: 10px;
    margin: 10px 0;
    background: rgba(239,68,68,0.1);
    border-left: 4px solid red;
}
</style>
</head>

<body>

<!-- Sidebar -->
<div class="sidebar">
    <div class="logo">⚡ LogSense AI</div>
    <div class="menu">
        <a href="dashboard.html">Dashboard</a>
        <a href="logs.html">Logs</a>
        <a href="alerts.html">Alerts</a>
        <a href="settings.html">Settings</a>
    </div>
</div>

<!-- Main -->
<div class="main">

    <!-- Navbar -->
    <div class="navbar">
        <h3>System Monitoring</h3>
        <div>
            <span class="user" id="user"></span>
            <button onclick="logout()">Logout</button>
        </div>
    </div>

    <!-- Content -->
    <div class="content">

        <!-- Cards -->
        <div class="cards">
            <div class="card"><h3>Total Logs</h3><p>12,450</p></div>
            <div class="card"><h3>Errors</h3><p>320</p></div>
            <div class="card"><h3>Warnings</h3><p>210</p></div>
            <div class="card"><h3>Alerts</h3><p>18</p></div>
        </div>

        <!-- Chart + Alerts -->
        <div class="grid">

            <div class="chart-box">
                <h3>Log Activity</h3>
                <canvas id="chart"></canvas>
            </div>

            <div class="alerts">
                <h3>🚨 Alerts</h3>
                <div class="alert">High CPU Usage</div>
                <div class="alert">Unauthorized Login Attempt</div>
                <div class="alert">Server Down</div>
            </div>

        </div>

        <!-- Logs Table -->
        <div class="table-box">
            <h3>Recent Logs</h3>
            <table>
                <tr>
                    <th>Time</th>
                    <th>Server</th>
                    <th>Status</th>
                </tr>
                <tr>
                    <td>10:20</td>
                    <td>Server-1</td>
                    <td>OK</td>
                </tr>
                <tr>
                    <td>10:25</td>
                    <td>Server-2</td>
                    <td class="error">ERROR</td>
                </tr>
                <tr>
                    <td>10:30</td>
                    <td>Server-3</td>
                    <td class="warning">WARNING</td>
                </tr>
            </table>
        </div>

    </div>

</div>

<script>
// Show user
let user = localStorage.getItem("loggedInUser");
if(!user){
    window.location.href = "index.html";
}
document.getElementById("user").innerText = user;

// Logout
function logout(){
    localStorage.removeItem("loggedInUser");
    window.location.href = "index.html";
}

// Chart
new Chart(document.getElementById("chart"), {
    type: 'line',
    data: {
        labels: ["10","20","30","40","50","60"],
        datasets: [{
            label: "Logs",
            data: [20,50,30,70,40,80],
            borderColor: "#22c55e"
        }]
    }
});
</script>

</body>
</html>
